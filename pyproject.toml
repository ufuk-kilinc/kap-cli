[project]
name = "kap-cli"
version = "0.1.0"
description = "CLI for the KAP Veri Yayın Servisi REST API (MKK / Borsa İstanbul)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
kap = "kap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
